# 5e Manager dietro il TUO nginx sull'host (certificati tuoi, es. Let's Encrypt).
# Uso:
#   1) metti deploy/nginx-upgrade-map.conf in /etc/nginx/conf.d/  (serve la map per WebSocket)
#   2) copia QUESTO file in /etc/nginx/sites-available/dnd.conf e sostituisci <DOMAIN>
#   3) ln -s /etc/nginx/sites-available/dnd.conf /etc/nginx/sites-enabled/dnd.conf
#   4) nginx -t && systemctl reload nginx        # il blocco :80 serve gia' per la challenge ACME
#   5) certbot certonly --webroot -w /var/www/certbot -d <DOMAIN>
#   6) nginx -t && systemctl reload nginx        # ora anche il blocco 443 e' attivo
# Il container 5emanager deve essere in ascolto su 127.0.0.1:3001
# (docker compose -f docker-compose.external-nginx.yml up -d --build).

# porta 80: redirect a https + webroot per le challenge ACME di certbot
server {
    listen 80;
    server_name <DOMAIN>;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name <DOMAIN>;

    # certificati Let's Encrypt standard (certbot certonly --webroot -w /var/www/certbot -d <DOMAIN>)
    ssl_certificate     /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # WebSocket (wss://<DOMAIN>) — multiplayer: l'upgrade passa grazie alla map in conf.d
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Host/X-Forwarded-Proto: il server deriva RP ID/origin delle passkey (o usa DND5E_RP_ID/DND5E_RP_ORIGIN)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # connessioni WS lunghe (campagna) e upload Possible (import schede con ritratto)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        client_max_body_size 50m;
    }
}
