# 5e Manager — server in Docker, modalità HTTP/LAN (rete locale, VPS senza dominio, test)
#
#   cd docker
#   cp .env.example .env        # opzionale: token admin e porta
#   docker compose up -d        # PULLA l'immagine ufficiale ghcr.io/tecmat/5emanager-server:latest
#   # update: docker compose pull && docker compose up -d
#   # build dal sorgente locale (modifiche tue): docker compose up -d --build
#   # dalla root del repo: docker compose -f docker/docker-compose.yml up -d
#
# Poi apri http://<ip-del-server>:3001 (web app) e usa ws://<ip-del-server>:3001 per il multiplayer.
# Pannello admin: http://<ip-del-server>:3001/admin
# Per esporlo su Internet con HTTPS: metti davanti alla 3001 il TUO reverse proxy (TLS + WebSocket) — vedi docs/DOCKER.md §2
# Dati persistenti (campagne, account, schede in libreria): ./data

services:
  5emanager:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/tecmat/5emanager-server:latest
    # default: pull da GHCR se l'immagine non c'è in locale; --build la ricostruisce dal sorgente
    container_name: 5emanager-server
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      PORT: "3001"
      HOST: 0.0.0.0
      DND5E_DATA_DIR: /data
      DND5E_STATIC_DIR: /app/apps/web/dist
      # token admin del pannello /admin (vuoto = senza token, ok solo in LAN fidata)
      DND5E_ADMIN_TOKEN: ${DND5E_ADMIN_TOKEN:-}
      # webapp di Docker: SENZA login non si accede al sito (pagina di login). App native: login facoltativo.
      DND5E_REQUIRE_AUTH: ${DND5E_REQUIRE_AUTH:-true}
      # registrazione: 'approval' (l'admin approva le richieste), 'open' (chiunque si registra subito) oppure 'invite' (solo link /invite?token=… dall'admin: univoci, a scadenza, monouso)
      DND5E_REGISTRATION: ${DND5E_REGISTRATION:-approval}
      # IP LAN reale dell'host (in Docker il bridge 172.x non serve): es. DND5E_LAN_IP=192.168.1.36
      DND5E_LAN_IP: ${DND5E_LAN_IP:-}
      # passkey WebAuthn (login passwordless su HTTPS): se il proxy passa Host intatto vengono derivati da soli
      DND5E_RP_ID: ${DND5E_RP_ID:-}
      DND5E_RP_ORIGIN: ${DND5E_RP_ORIGIN:-}
      # opzionale (repo privato): GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ./data:/data
