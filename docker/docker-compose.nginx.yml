# 5e Manager — server in Docker + nginx come reverse proxy HTTPS (tu gestisci certificati e proxy)
#
#   cd docker
#   cp .env.example .env
#   # modifica .env: DND5E_DOMAIN=dnd.tuosito.it, DND5E_ADMIN_TOKEN=<token-sicuro>
#   mkdir -p certs data
#   # metti i certificati in docker/certs/fullchain.pem e docker/certs/privkey.pem
#   # (es. certbot certonly --webroot -w docker/certbot-webroot -d dnd.tuosito.it e copia i file)
#   docker compose -f docker-compose.nginx.yml up -d --build
#
#   ATTENZIONE: questo file pubblica 80/443 con un nginx IN CONTAINER. Se sull'host hai
#   gia' il TUO nginx su 80/443 (certificati tuoi), qui fallisce con 'bind: address already in use':
#   in quel caso usa invece docker-compose.external-nginx.yml (server su 127.0.0.1:3001 + tuo nginx,
#   vedi docs/DOCKER.md sezione 2b e deploy/nginx-external.conf).
#
# Risultato: https://dnd.tuosito.it (web app + /admin) e wss://dnd.tuosito.it (multiplayer WS).

services:
  5emanager:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: 5emanager-server:latest
    pull_policy: build # mai pull da registry: senza immagine locale si builda dal sorgente
    container_name: 5emanager-server
    restart: unless-stopped
    expose:
      - "3001" # niente porta pubblica: parla solo con nginx
    environment:
      PORT: "3001"
      HOST: 0.0.0.0
      DND5E_DATA_DIR: /data
      DND5E_STATIC_DIR: /app/apps/web/dist
      DND5E_ADMIN_TOKEN: ${DND5E_ADMIN_TOKEN:-}
      # IP LAN reale dell'host (in Docker il bridge 172.x non serve): es. DND5E_LAN_IP=192.168.1.36
      DND5E_LAN_IP: ${DND5E_LAN_IP:-}
      # passkey WebAuthn: RP ID = dominio pubblico, origin = https del dominio
      # (nginx passa Host $host, quindi anche senza queste il server le deriva giuste)
      DND5E_RP_ID: ${DND5E_DOMAIN:?imposta DND5E_DOMAIN nel .env}
      DND5E_RP_ORIGIN: https://${DND5E_DOMAIN:?imposta DND5E_DOMAIN nel .env}
      # opzionale: primo account admin (bootstrap) — il primo account registrato diventa admin lo stesso
      # DND5E_ADMIN_USER: ${DND5E_ADMIN_USER:-}
      # GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ./data:/data
    networks:
      - dnd

  nginx:
    image: nginx:alpine
    container_name: 5emanager-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # dominio pubblico (record A -> IP del server); l'immagine nginx lo sostituisce nel template
      DND5E_DOMAIN: ${DND5E_DOMAIN:?imposta DND5E_DOMAIN nel .env, es. dnd.tuosito.it}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot-webroot:/var/www/certbot:ro # per i rinnovi ACME di Let's Encrypt
    depends_on:
      - 5emanager
    networks:
      - dnd

networks:
  dnd:
