# 5e Manager — server in Docker + TUO nginx esterno sull'host (certificati gestiti da te,
# es. Let's Encrypt via certbot sull'host). Alternativa a docker-compose.nginx.yml (nginx in container).
#
#   cd docker
#   cp -n .env.example .env
#   # modifica .env: DND5E_DOMAIN=dnd.tuosito.it, DND5E_ADMIN_TOKEN=<token-lungo-casuale>
#   docker compose -f docker-compose.external-nginx.yml up -d --build
#
# Il container pubblica SOLO 127.0.0.1:3001: l'unico client e' il tuo nginx sull'host, che fa
# reverse proxy HTTPS (snippet pronto: deploy/nginx-external.conf + deploy/nginx-upgrade-map.conf).
# Risultato: https://dnd.tuosito.it (web app + /admin) e wss://dnd.tuosito.it (multiplayer).
# Vedi docs/DOCKER.md sezione "HTTPS con il tuo nginx esterno".

services:
  5emanager:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: 5emanager-server:latest
    pull_policy: build # mai pull da registry: senza immagine locale si builda dal sorgente
    container_name: 5emanager-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001" # solo localhost dell'host: 3001 resta chiuso verso l'esterno
    environment:
      PORT: "3001"
      HOST: 0.0.0.0
      DND5E_DATA_DIR: /data
      DND5E_STATIC_DIR: /app/apps/web/dist
      DND5E_ADMIN_TOKEN: ${DND5E_ADMIN_TOKEN:-}
      # webapp di Docker: SENZA login non si accede al sito (pagina di login). App native: login facoltativo.
      DND5E_REQUIRE_AUTH: ${DND5E_REQUIRE_AUTH:-true}
      # registrazione: 'approval' (l'admin approva le richieste) oppure 'open' (chiunque si registra subito)
      DND5E_REGISTRATION: ${DND5E_REGISTRATION:-approval}
      # IP LAN reale dell'host (in Docker il bridge 172.x non serve): es. DND5E_LAN_IP=192.168.1.36
      DND5E_LAN_IP: ${DND5E_LAN_IP:-}
      # passkey WebAuthn (HTTPS terminated dal tuo nginx): dominio e origin pubblici
      DND5E_RP_ID: ${DND5E_DOMAIN:?imposta DND5E_DOMAIN nel .env, es. dnd.tuosito.it}
      DND5E_RP_ORIGIN: https://${DND5E_DOMAIN:?imposta DND5E_DOMAIN nel .env}
      # opzionale: primo admin bootstrap
      # DND5E_ADMIN_USER: ${DND5E_ADMIN_USER:-}
      # GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ./data:/data
