<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5e Manager — Login</title>
<style>
  :root { color-scheme: dark; --bg:#14110d; --panel:#201b15; --panel2:#2a231b; --border:#3e352a; --text:#ece4d4; --muted:#a3947c; --accent:#c9a227; --accent2:#8a6fd8; --accent-dim:rgba(201,162,39,.5); --stripe:rgba(201,162,39,.05); --font-display:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text); font:15px/1.5 'Segoe UI',system-ui,sans-serif; background-image:linear-gradient(var(--stripe) 1px,transparent 1px),linear-gradient(90deg,var(--stripe) 1px,transparent 1px); background-size:26px 26px; }
  .card { background:var(--panel); border:1px solid var(--border); border-top:2px solid var(--accent-dim); border-radius:14px; padding:26px; width:min(430px,92vw); box-shadow:0 12px 34px rgba(0,0,0,.5); }
  h1 { font-family:var(--font-display); font-size:21px; margin:0 0 4px; color:var(--accent); display:flex; align-items:center; gap:8px; letter-spacing:.03em; }
  .muted { color:var(--muted); font-size:13px; }
  label { display:block; margin:14px 0 4px; font-size:12px; color:var(--muted); }
  input { width:100%; padding:8px 11px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; }
  input:focus { outline:2px solid var(--accent-dim); border-color:var(--accent); }
  .row { display:flex; gap:10px; align-items:center; margin-top:16px; }
  button { padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:var(--text); cursor:pointer; font-size:13px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:linear-gradient(180deg,#dcb644,#b8920f); border-color:#7c610c; color:#1c1607; font-weight:700; flex:1; }
  button:disabled { opacity:.45; cursor:default; }
  .err,.error { color:#e08080; font-size:13px; margin-top:10px; min-height:18px; }
  .ok { color:#7fc97f; font-size:13px; margin-top:10px; }
  .chk { display:flex; gap:8px; align-items:center; font-size:13px; color:var(--muted); margin-top:12px; }
  .tabs { display:flex; gap:8px; margin-top:18px; }
  .tabs button { flex:1; background:none; border:none; border-bottom:2px solid transparent; border-radius:8px 8px 0 0; }
  .tabs button.on { border-bottom-color:var(--accent); color:var(--accent); font-weight:600; }
  #totpBox { display:none; }
  a,.link { color:var(--accent); }
  code { background:var(--bg); border:1px solid var(--border); padding:1px 6px; border-radius:6px; font-size:12px; }
</style>
</head>
<body>
<div class="card">
  <h1>🎲 5e Manager</h1>
  <div class="muted" id="sub">Questo server richiede un account per accedere.</div>
  <div class="tabs">
    <button id="tabLogin" class="on" type="button">Login</button>
    <button id="tabReg" type="button">Registrati</button>
  </div>
  <div class="muted" style="margin-top:10px">Hai un invito dell'admin? <a href="/invite">Apri la pagina dell'invito 🎟️</a></div>
  <form id="f">
    <label for="u">Username</label>
    <input id="u" autocomplete="username" required>
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" required>
    <div id="totpBox">
      <label for="c">Codice 2FA (app authenticator)</label>
      <input id="c" inputmode="numeric" maxlength="6" placeholder="123456">
    </div>
    <label class="chk"><input type="checkbox" id="remember" style="width:auto"> Mantieni l'accesso su questo dispositivo</label>
    <div class="row">
      <button class="primary" id="go" type="submit">Entra</button>
      <button type="button" id="pkbtn" style="display:none" title="Accedi con una passkey (impronta/PIN/Windows Hello/password manager): niente password">🔑 Passkey</button>
    </div>
    <div class="err" id="err"></div>
    <div class="ok" id="ok"></div>
  </form>
  <div class="muted" style="margin-top:14px" id="regInfo"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
let mode = 'login';
let registration = 'approval';

async function info() {
  try {
    const r = await fetch('/api/info');
    const j = await r.json();
    registration = j.registration || 'approval';
    $('regInfo').textContent = registration === 'open'
      ? 'Registrazione aperta: chiunque può creare un account.'
      : registration === 'invite'
        ? 'Registrazione solo su invito: usa il link /invite?token=… che ti ha dato l\'admin (scade e vale una sola volta).'
        : 'Registrazione con approvazione: l\'admin approva le richieste dal pannello /admin.';
    // in modalità solo-su-invito la registrazione in proprio non esiste: nascondo la tab
    if (registration === 'invite') {
      $('tabReg').style.display = 'none';
      if (mode === 'register') { mode = 'login'; $('tabLogin').classList.add('on'); $('tabReg').classList.remove('on'); $('go').textContent = 'Entra'; }
    }
  } catch {}
}

$('tabLogin').onclick = () => { mode = 'login'; $('tabLogin').classList.add('on'); $('tabReg').classList.remove('on'); $('go').textContent = 'Entra'; };
$('tabReg').onclick = () => { mode = 'register'; $('tabReg').classList.add('on'); $('tabLogin').classList.remove('on'); $('go').textContent = 'Crea account'; };

$('f').onsubmit = async (e) => {
  e.preventDefault();
  $('err').textContent = ''; $('ok').textContent = '';
  $('go').disabled = true;
  try {
    const body = { username: $('u').value.trim(), password: $('p').value, remember: $('remember').checked };
    if ($('totpBox').style.display === 'block') body.code = $('c').value.trim();
    const path = mode === 'login' ? '/api/login' : '/api/register';
    const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json();
    if (r.status === 401 && j.totpRequired) {
      $('totpBox').style.display = 'block';
      $('err').textContent = 'Serve il codice 2FA.';
      return;
    }
    if (!r.ok) { $('err').textContent = j.error || ('Errore ' + r.status); return; }
    if (mode === 'register' && j.pending) {
      $('ok').textContent = j.message || 'Richiesta inviata: attendi l\'approvazione dell\'admin.';
      return;
    }
    // login ok (o registrazione aperta con auto-login): cookie impostato -> ricarico
    $('ok').textContent = 'Accesso riuscito, carico l\'app…';
    location.reload();
  } catch (err) {
    $('err').textContent = String(err);
  } finally {
    $('go').disabled = false;
  }
};

// --- login con passkey (WebAuthn) direttamente da questa pagina, senza WS ---
const b64uToBuf = (s) => Uint8Array.from(atob(String(s).replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
const bufToB64u = (b) => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const pkBtn = $('pkbtn');
if (window.PublicKeyCredential && window.isSecureContext) pkBtn.style.display = '';
pkBtn.onclick = async () => {
  $('err').textContent = ''; $('ok').textContent = '';
  pkBtn.disabled = true;
  try {
    const r = await fetch('/api/passkey/options', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ username: $('u').value.trim() || undefined }) });
    const j = await r.json();
    if (!r.ok) { $('err').textContent = j.error || ('Errore ' + r.status); return; }
    const o = j.options;
    o.challenge = b64uToBuf(o.challenge);
    if (o.allowCredentials) o.allowCredentials = o.allowCredentials.map((c) => ({ ...c, id: b64uToBuf(c.id) }));
    const cred = await navigator.credentials.get({ publicKey: o });
    if (!cred) { $('err').textContent = 'Nessuna passkey scelta'; return; }
    const resp = {
      id: cred.id,
      rawId: bufToB64u(cred.rawId),
      type: cred.type,
      response: {
        authenticatorData: bufToB64u(cred.response.authenticatorData),
        clientDataJSON: bufToB64u(cred.response.clientDataJSON),
        signature: bufToB64u(cred.response.signature),
        userHandle: cred.response.userHandle ? bufToB64u(cred.response.userHandle) : null,
      },
    };
    const r2 = await fetch('/api/passkey/verify', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ response: resp }) });
    const j2 = await r2.json();
    if (!r2.ok) { $('err').textContent = j2.error || 'Passkey non valida'; return; }
    $('ok').textContent = 'Accesso riuscito con passkey, carico l\'app…';
    location.reload(); // cookie di sessione impostato -> entro nell'app
  } catch (e) {
    $('err').textContent = 'Passkey non disponibile o annullata: ' + e;
  } finally {
    pkBtn.disabled = false;
  }
};

info();
// primo avvio senza account: vai subito al setup (creazione primo admin)
fetch('/api/setup').then((r) => r.json()).then((j) => { if (j.setupRequired) location.replace('/setup'); }).catch(() => {});
// se esiste già una sessione valida, ricarica subito
fetch('/api/me').then((r) => { if (r.ok) location.reload(); }).catch(() => {});
</script>
</body>
</html>
