<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5e Manager — Invito</title>
<style>
  :root { color-scheme: dark; --bg:#14110d; --panel:#201b15; --panel2:#2a231b; --border:#3e352a; --text:#ece4d4; --muted:#a3947c; --accent:#c9a227; --accent2:#8a6fd8; --accent-dim:rgba(201,162,39,.5); --stripe:rgba(201,162,39,.05); --font-display:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text); font:15px/1.5 'Segoe UI',system-ui,sans-serif; background-image:linear-gradient(var(--stripe) 1px,transparent 1px),linear-gradient(90deg,var(--stripe) 1px,transparent 1px); background-size:26px 26px; }
  .card { background:var(--panel); border:1px solid var(--border); border-top:2px solid var(--accent-dim); border-radius:14px; padding:26px; width:min(430px,92vw); box-shadow:0 12px 34px rgba(0,0,0,.5); }
  h1 { font-family:var(--font-display); font-size:21px; margin:0 0 4px; color:var(--accent); display:flex; align-items:center; gap:8px; letter-spacing:.03em; }
  .muted { color:var(--muted); font-size:13px; }
  label { display:block; margin:14px 0 4px; font-size:12px; color:var(--muted); }
  input { width:100%; padding:8px 11px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; }
  input:focus { outline:2px solid var(--accent-dim); border-color:var(--accent); }
  .row { display:flex; gap:10px; align-items:center; margin-top:16px; }
  button { padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:var(--text); cursor:pointer; font-size:13px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:linear-gradient(180deg,#dcb644,#b8920f); border-color:#7c610c; color:#1c1607; font-weight:700; flex:1; }
  button:disabled { opacity:.45; cursor:default; }
  .err,.error { color:#e08080; font-size:13px; margin-top:10px; min-height:18px; }
  .ok { color:#7fc97f; font-size:13px; margin-top:10px; }
  .chk { display:flex; gap:8px; align-items:center; font-size:13px; color:var(--muted); margin-top:12px; }
  .tabs { display:flex; gap:8px; margin-top:18px; }
  .tabs button { flex:1; background:none; border:none; border-bottom:2px solid transparent; border-radius:8px 8px 0 0; }
  .tabs button.on { border-bottom-color:var(--accent); color:var(--accent); font-weight:600; }
  #totpBox { display:none; }
  a,.link { color:var(--accent); }
  code { background:var(--bg); border:1px solid var(--border); padding:1px 6px; border-radius:6px; font-size:12px; }
</style>
</head>
<body>
<div class="card">
  <h1>🎟️ 5e Manager — Invito</h1>
  <div class="muted" id="sub">Usa il link di invito ricevuto dall'amministratore per creare il tuo account.</div>

  <div id="tokenBox">
    <label for="tok">Link o token di invito</label>
    <input id="tok" placeholder="https://…/invite?token=… oppure solo il token">
    <div class="row"><button class="primary" id="tokGo" type="button">Verifica invito</button></div>
  </div>

  <form id="f" style="display:none">
    <div class="muted" id="validInfo"></div>
    <label for="u">Username</label>
    <input id="u" autocomplete="username" required>
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="new-password" required>
    <label class="chk"><input type="checkbox" id="remember" style="width:auto"> Mantieni l'accesso su questo dispositivo</label>
    <div class="row"><button class="primary" id="go" type="submit">Crea account</button></div>
  </form>
  <div class="err" id="err"></div>
  <div class="ok" id="ok"></div>
  <div class="muted" style="margin-top:14px">Hai già un account? <a href="/login" class="link">Vai al login</a></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
// estrae il token da un link completo o dal token nudo
function tokenFrom(s) {
  s = String(s || '').trim();
  try { const u = new URL(s, location.origin); const t = u.searchParams.get('token'); if (t) return t; } catch {}
  return s;
}
let token = tokenFrom(new URLSearchParams(location.search).get('token') || '');

async function check(tok) {
  $('err').textContent = ''; $('ok').textContent = '';
  try {
    const r = await fetch('/api/invite?token=' + encodeURIComponent(tok));
    const j = await r.json();
    if (j.valid) {
      $('tokenBox').style.display = 'none';
      $('f').style.display = 'block';
      $('validInfo').innerHTML = 'Invito valido fino al <b>' + new Date(j.expiresAt).toLocaleString('it-IT') + '</b> (monouso: vale una sola volta).';
      return true;
    }
    $('err').textContent = j.reason === 'expired' ? 'Questo invito è scaduto.' : j.reason === 'used' ? 'Questo invito è già stato usato (vale una sola volta).' : 'Invito non valido.';
    return false;
  } catch { $('err').textContent = 'Server non raggiungibile.'; return false; }
}

$('tokGo').onclick = async () => {
  const t = tokenFrom($('tok').value);
  if (!t) return;
  token = t;
  await check(t);
};

$('f').onsubmit = async (e) => {
  e.preventDefault();
  $('err').textContent = ''; $('ok').textContent = '';
  $('go').disabled = true;
  try {
    const r = await fetch('/api/invite', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ token, username: $('u').value.trim(), password: $('p').value, remember: $('remember').checked }),
    });
    const j = await r.json();
    if (!r.ok) { $('err').textContent = j.error || ('Errore ' + r.status); return; } // es. username occupato: l'invito resta valido, riprova
    $('ok').textContent = 'Account "' + j.username + '" creato: entro nell\'app…';
    setTimeout(() => { location.href = '/'; }, 700); // cookie di sessione già impostato
  } catch (err2) {
    $('err').textContent = String(err2);
  } finally {
    $('go').disabled = false;
  }
};

if (token) { $('tok').value = token; check(token); } else { $('tokenBox').style.display = 'block'; }
</script>
</body>
</html>
