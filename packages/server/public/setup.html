<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5e Manager — Setup iniziale</title>
<style>
  :root { color-scheme: dark; --bg:#14110d; --panel:#201b15; --panel2:#2a231b; --border:#3e352a; --text:#ece4d4; --muted:#a3947c; --accent:#c9a227; --accent2:#8a6fd8; --accent-dim:rgba(201,162,39,.5); --stripe:rgba(201,162,39,.05); --font-display:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text); font:15px/1.5 'Segoe UI',system-ui,sans-serif; background-image:linear-gradient(var(--stripe) 1px,transparent 1px),linear-gradient(90deg,var(--stripe) 1px,transparent 1px); background-size:26px 26px; }
  .card { background:var(--panel); border:1px solid var(--border); border-top:2px solid var(--accent-dim); border-radius:14px; padding:26px; width:min(430px,92vw); box-shadow:0 12px 34px rgba(0,0,0,.5); }
  h1 { font-family:var(--font-display); font-size:21px; margin:0 0 4px; color:var(--accent); display:flex; align-items:center; gap:8px; letter-spacing:.03em; }
  .muted { color:var(--muted); font-size:13px; }
  label { display:block; margin:14px 0 4px; font-size:12px; color:var(--muted); }
  input { width:100%; padding:8px 11px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; }
  input:focus { outline:2px solid var(--accent-dim); border-color:var(--accent); }
  .row { display:flex; gap:10px; align-items:center; margin-top:16px; }
  button { padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:var(--text); cursor:pointer; font-size:13px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:linear-gradient(180deg,#dcb644,#b8920f); border-color:#7c610c; color:#1c1607; font-weight:700; flex:1; }
  button:disabled { opacity:.45; cursor:default; }
  .err,.error { color:#e08080; font-size:13px; margin-top:10px; min-height:18px; }
  .ok { color:#7fc97f; font-size:13px; margin-top:10px; }
  .chk { display:flex; gap:8px; align-items:center; font-size:13px; color:var(--muted); margin-top:12px; }
  .tabs { display:flex; gap:8px; margin-top:18px; }
  .tabs button { flex:1; background:none; border:none; border-bottom:2px solid transparent; border-radius:8px 8px 0 0; }
  .tabs button.on { border-bottom-color:var(--accent); color:var(--accent); font-weight:600; }
  #totpBox { display:none; }
  a,.link { color:var(--accent); }
  code { background:var(--bg); border:1px solid var(--border); padding:1px 6px; border-radius:6px; font-size:12px; }
</style>
</head>
<body>
<div class="card">
  <h1>🎲 5e Manager — Setup iniziale</h1>
  <div class="muted" id="desc">Crea il primo account <b>admin</b> del server. Poi apri il <a href="/admin">pannello admin</a> e l'<a href="/">app</a>.</div>
  <div id="token-row" style="display:none">
    <div class="muted" style="margin-top:10px">Il server ha un <code>DND5E_ADMIN_TOKEN</code> (generato da Docker nei log / in <code>admin-token.txt</code>): inseriscilo per autorizzare il setup.</div>
    <input id="token" type="password" placeholder="Token admin (x-admin-token)">
  </div>
  <input id="username" placeholder="Username admin (3-24: lettere, numeri, _ -)" autocomplete="username">
  <input id="password" type="password" placeholder="Password (min 4 caratteri)" autocomplete="new-password">
  <button id="go" class="primary">Crea account admin</button>
  <div id="msg"></div>
  <div class="muted" style="margin-top:10px">Già configurato? Vai al <a href="/">app</a> o al <a href="/admin">pannello admin</a>.</div>
</div>
<script>
const $ = (id) => document.getElementById(id);
async function init() {
  try {
    const r = await fetch('/api/setup');
    const j = await r.json();
    if (j.tokenRequired) $('token-row').style.display = 'block';
    if (!j.setupRequired) {
      $('desc').innerHTML = 'Setup già completato: esistono già account. Vai al <a href="/">app</a> o al <a href="/admin">pannello admin</a>.';
      $('go').disabled = true;
    }
  } catch { /* ignora */ }
}
$('go').onclick = async () => {
  $('msg').innerHTML = '';
  const body = { username: $('username').value.trim(), password: $('password').value };
  const headers = { 'content-type': 'application/json' };
  const tok = $('token').value;
  if (tok) headers['x-admin-token'] = tok;
  try {
    const r = await fetch('/api/setup', { method: 'POST', headers, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    $('go').disabled = true;
    $('username').disabled = true;
    $('password').disabled = true;
    // login automatico con le credenziali appena create (cookie di sessione) -> entra direto nell'app
    try {
      const lr = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ username: body.username, password: body.password }) });
      if (lr.ok) {
        $('msg').innerHTML = '<div class="ok">✅ Account admin <b>' + j.username + '</b> creato: entro nell\'app…</div>';
        setTimeout(() => { location.href = '/'; }, 700);
        return;
      }
    } catch { /* fallback: login manuale */ }
    $('msg').innerHTML = '<div class="ok">✅ Account admin <b>' + j.username + '</b> creato. Vai al <a href="/admin">pannello admin</a> o all\'<a href="/">app</a> (login con queste credenziali).</div>';
  } catch (e) {
    $('msg').innerHTML = '<div class="error">❌ ' + String(e.message).replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '</div>';
  }
};
init();
</script>
</body>
</html>
