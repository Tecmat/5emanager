[package]
name = "emanager"
version = "0.1.11"
description = "Gestore di schede D&D 5e — desktop (Tauri v2)"
edition = "2021"

[lib]
name = "emanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true
