[package]
name = "emanager"
version = "0.1.66"
description = "Gestore di schede D&D 5e — desktop (Tauri v2)"
edition = "2021"

[lib]
name = "emanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# check/download aggiornamenti AppImage (GitHub releases) direttamente dal processo desktop
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
# beacon LAN per il P2P "stile Soul Knight": mini server HTTP (/api/info) + WebSocket (/ws) sul dispositivo host
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "ws", "json", "query"] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true
